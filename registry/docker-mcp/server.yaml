name: simplelogin-mcp
image: ghcr.io/enthouan/simplelogin-mcp:0.7.0
type: server
meta:
  category: productivity
  tags:
    - email
    - aliases
    - privacy
    - simplelogin
    - mcp
about:
  title: SimpleLogin MCP
  description: Manage SimpleLogin aliases, mailboxes, domains, settings, and account utilities.
  icon: https://www.google.com/s2/favicons?domain=simplelogin.io&sz=64
source:
  project: https://github.com/enthouan/simplelogin-mcp
  branch: main
  commit: b306dfed6fd55ca30496669ef2d867b58e234f4a
config:
  description: Configure SimpleLogin API access for simplelogin-mcp.
  secrets:
    - name: simplelogin-mcp.sl_api_key
      env: SL_API_KEY
      example: sl-your-key-here
  env:
    - name: TRANSPORT
      value: stdio
    - name: SL_API_URL
      example: https://app.simplelogin.io
      value: '{{simplelogin-mcp.sl_api_url}}'
    - name: SL_REQUEST_TIMEOUT_MS
      example: '15000'
      value: '{{simplelogin-mcp.sl_request_timeout_ms}}'
  parameters:
    type: object
    properties:
      sl_api_url:
        type: string
        default: https://app.simplelogin.io
      sl_request_timeout_ms:
        type: string
        default: '15000'
