######################
# Environment        #
######################

### Required
# - SL_API_KEY

### Service-Specific
# - SIMPLELOGIN_MCP_HOST_BIND_IP:-127.0.0.1
# - SIMPLELOGIN_MCP_HOST_PORT:-3000
# - SIMPLELOGIN_MCP_IMAGE_TAG:-latest
# - SL_API_URL:-https://app.simplelogin.io
# - NODE_EXTRA_CA_CERTS:-
# - MCP_AUTH_TOKEN:-
# - MCP_ALLOWED_ORIGINS:-
# - ALLOW_UNAUTHENTICATED_EXPOSURE:-false
# - SL_REQUEST_TIMEOUT_MS:-15000

services:
  simplelogin-mcp:
    # Operator/self-hosted path: pull the published multi-arch image from GHCR.
    image: ghcr.io/enthouan/simplelogin-mcp:${SIMPLELOGIN_MCP_IMAGE_TAG:-latest}
    container_name: simplelogin-mcp
    restart: unless-stopped
    environment:
      - SL_API_KEY=${SL_API_KEY:?Set SL_API_KEY in .env}
      - SL_API_URL=${SL_API_URL:-https://app.simplelogin.io}
      - NODE_EXTRA_CA_CERTS=${NODE_EXTRA_CA_CERTS:-}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-}
      - MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-}
      - ALLOW_UNAUTHENTICATED_EXPOSURE=${ALLOW_UNAUTHENTICATED_EXPOSURE:-false}
      - SL_REQUEST_TIMEOUT_MS=${SL_REQUEST_TIMEOUT_MS:-15000}
      # Inside the container the app must bind all interfaces, otherwise Docker's
      # published port can't reach it. Keep MCP_AUTH_TOKEN set in .env; the
      # non-loopback startup guard remains active so widening `ports` cannot
      # accidentally publish an unauthenticated server.
      - TRANSPORT=http
      - HOST=0.0.0.0
      # Keep the container listener fixed for Compose. Use
      # SIMPLELOGIN_MCP_HOST_PORT to change the host-side published port.
      - PORT=3000
    ports:
      # Published on the host's loopback only: the server is reachable from this
      # machine but NOT from your LAN. To expose it on the LAN, keep
      # MCP_AUTH_TOKEN set and set SIMPLELOGIN_MCP_HOST_BIND_IP to 0.0.0.0 or a
      # specific LAN IP. See SECURITY.md before doing so.
      - '${SIMPLELOGIN_MCP_HOST_BIND_IP:-127.0.0.1}:${SIMPLELOGIN_MCP_HOST_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
