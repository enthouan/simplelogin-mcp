services:
  simplelogin-mcp:
    # Build from source so `docker compose up` works with no registry access.
    # To use the prebuilt image instead, comment out `build:` and set:
    #   image: ghcr.io/enthouan/simplelogin-mcp:latest
    build: .
    image: simplelogin-mcp:latest
    container_name: simplelogin-mcp
    restart: unless-stopped
    env_file: .env
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
