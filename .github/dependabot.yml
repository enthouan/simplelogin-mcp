version: 2

updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '08:30'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 4
    cooldown:
      semver-patch-days: 1
      semver-minor-days: 1
      semver-major-days: 30
    labels:
      - 'dependencies'
      - 'area:security'
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
    groups:
      production-minor-patch:
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
      development-minor-patch:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '09:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 1
    labels:
      - 'area:ci'
      - 'area:security'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '09:30'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 1
    labels:
      - 'area:docker'
      - 'area:security'
    ignore:
      - dependency-name: 'node'
        update-types:
          - 'version-update:semver-major'
    groups:
      docker-images:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
